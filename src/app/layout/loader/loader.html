@if (visible()) {
  <div class="loader" role="status" [attr.aria-label]="'common.loading' | transloco">
    <!-- Fondo propio: se disuelve mientras la mariposa vuela y deja ver la página -->
    <div class="backdrop" aria-hidden="true"></div>

    <div class="seed" aria-hidden="true">
      <div class="shadow"></div>
      <div class="glow"></div>
      <div class="half half-l"><svg class="svg-seed-l" viewBox="-80 -100 160 200"></svg></div>
      <div class="half half-r"><svg class="svg-seed-r" viewBox="-80 -100 160 200"></svg></div>
      <div class="crack"><svg class="svg-crack" viewBox="-80 -100 160 200"></svg></div>
      @for (g of glints; track g) {
        <span class="glint"></span>
      }
    </div>

    <div class="bf" aria-hidden="true">
      <div class="bf-inner">
        <div class="wing wing-l"><svg class="svg-wing-l" viewBox="-80 -60 80 120"></svg></div>
        <div class="wing wing-r"><svg class="svg-wing-r" viewBox="0 -60 80 120"></svg></div>
        <div class="bf-body"><svg class="svg-body" viewBox="-10 -36 20 72"></svg></div>
      </div>
    </div>

    <button type="button" class="skip" (click)="skip()">
      {{ 'common.skip_intro' | transloco }}
    </button>
  </div>
}
