server {
    listen 8080;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml application/manifest+json;

    # Archivos de Astro con hash en el nombre (/_astro/App.XXXX.js, estilos, fuentes)
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ ^/(media|fonts|brand|svg)/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Sitio estático (SSG): cada ruta es un HTML generado en el build (/, /en/, /zh/…).
    # Sin barra final (/en) se redirige a la URL canónica (/en/) para no duplicar páginas.
    location ~ ^/(en|zh|fr|it|ar|he|ja|ko)$ {
        return 301 $uri/$is_args$args;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html $uri.html =404;
    }
}
