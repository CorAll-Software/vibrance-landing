server {
    listen 8080;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml application/manifest+json;

    # Archivos con hash en el nombre (main-XXXX.js, styles-XXXX.css)
    location ~* "-[A-Z0-9]{8}\.(js|css)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ ^/(media|fonts|brand|svg|i18n)/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA: cualquier otra ruta cae en index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
